name: Publish

# Publishes the `@satcomx00-x00/solow` package to npm, which is what makes
# `npx @satcomx00-x00/solow` work. (The unscoped `solow` name is blocked by npm's own
# anti-typosquatting policy — too close to `solc`/`color` — hence the scope.)
#
# Releases are cut by tag: push `v0.2.0` and this builds and publishes 0.2.0. The tag is the
# trigger *and* the source of truth for the version — the guard below refuses to publish if
# packages/cli/package.json disagrees with it, so a tag can never ship a different version than
# it names.
#
# Ordinarily nobody pushes that tag by hand: `release.yml` does it when a merge to main carries a
# version bump and Verify goes green, then dispatches this workflow at the tag it just created. A
# hand-pushed tag still works exactly as it always did — that path is the fallback, not the plan.
#
# Dry runs are available from the Actions tab (workflow_dispatch) and go all the way through
# packing without publishing, so the build can be exercised without burning a version number.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack, but do not publish"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Create the GitHub Release at the end. Read would be enough for the build itself.
  contents: write
  # Lets npm attach a provenance attestation — a signed, public record tying the published
  # tarball to this workflow run and this commit. Without it `npm publish --provenance` fails.
  id-token: write

env:
  # Keep in sync with `packageManager` in package.json.
  BUN_VERSION: "1.3.14"

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    # Room for the tarball smoke below: it installs a ~100MB vendored binary and boots the stack.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Whether this run ships, decided once and read by every step that would.
      #
      # It is a shell comparison against the *rendered* input rather than the expression
      # `inputs.dry_run == false`, and the difference is not cosmetic: a boolean input arrives as a
      # real boolean when a human ticks the box in the Actions tab, but as the string "false" when
      # the API dispatches it — which is how `release.yml` starts this workflow. GitHub's
      # expression comparison casts both sides to numbers, "false" becomes NaN, and the test
      # silently answers "no" — a release that tags, builds, packs, and quietly publishes nothing.
      # Rendered into shell, both spellings are the same four characters.
      - name: Decide whether this run publishes
        id: mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] || [ "$DRY_RUN" = "false" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # npm itself does the publishing: Bun's publish does not support provenance, and
      # `setup-node` is what writes the .npmrc that authenticates NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A tag that disagrees with the manifest means someone tagged without bumping (or bumped
      # without tagging). Either way the release is not what it claims to be — stop before npm
      # records a version that no tag points at.
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match packages/cli/package.json ($manifest)"
            exit 1
          fi
          echo "publishing version $manifest"

      # The same gates `verify.yml` runs on every PR. Repeated here rather than assumed: a tag
      # can be pushed at any commit, including one that never went through a pull request.
      - name: Lint (Biome)
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        run: make test

      # Produces packages/cli/dist: the traced standalone web build, the orchestrator and the
      # database entry points as self-contained bundles, and the migration SQL.
      - name: Build the package
        run: bun run --filter '@satcomx00-x00/solow' build

      - name: Inspect the tarball
        working-directory: packages/cli
        run: npm pack --dry-run

      # Must run *before* the CLI is published: the CLI declares these as optionalDependencies,
      # and an install would find nothing if the CLI landed on npm first.
      #
      # They carry the Inngest Dev Server binary inside the tarball, one package per platform,
      # so the CLI installs from npm alone — no postinstall, no download, works airgapped.
      # Versioned on Inngest rather than on SoloW, so this is a no-op on every release that does
      # not move the Inngest version (the script checks npm and skips what is already there).
      - name: Publish the Inngest binaries
        if: steps.mode.outputs.publish == 'true'
        run: bun run packages/cli/scripts/build-inngest-packages.ts --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The gate every other one in this file cannot be: it installs the tarball into an empty
      # directory and boots the whole stack. `npm pack --dry-run` above lists what is inside;
      # this is the only step that asks whether what is inside runs.
      #
      # Both npm releases that shipped broken passed every check above. `npm pack` strips
      # symlinks, so the traced Next.js build arrived without its dependencies ("Cannot find
      # package 'next'"); and the Inngest binary arrived as a Node stub rather than an
      # executable ("inngest cli binary not found"). Neither is visible from the source tree.
      #
      # Placed after the Inngest packages are published because the CLI declares them as
      # optionalDependencies and the install below resolves them from npm. They are versioned on
      # Inngest rather than on SoloW, so on a dry run that does not move the Inngest version the
      # already-published ones resolve fine.
      - name: Install and run the packed tarball
        run: make smoke-tarball

      - name: Publish
        if: steps.mode.outputs.publish == 'true'
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The release the tag has been standing in for. Created last, and only once npm has the
      # version: a Release is an announcement, and one that outlives a failed publish tells every
      # reader the opposite of what happened. `--generate-notes` writes them from the commits and
      # pull requests since the previous tag, which is the same history the tag already implies —
      # so nothing has to be maintained by hand for it to be right.
      - name: Create the GitHub Release
        if: steps.mode.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A re-run of this workflow reaches here only if npm accepted the version again, which
          # it will not — but a Release that already exists is still not a reason to fail the run
          # that produced the thing it announces.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists — leaving it as it is."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

      - name: Dry run complete
        if: steps.mode.outputs.publish != 'true'
        run: echo "Dry run — built and packed, nothing published."
