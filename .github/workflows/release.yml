name: Release

# Cuts a release when the commits merged to main say one is due.
#
# The version used to be decided by hand, in the pull request that earned it, and this workflow
# only noticed afterwards: it read `packages/cli/package.json` and tagged it if the tag was new.
# That is a defensible place for the decision and it had one failure mode that mattered — it is a
# step a human has to remember at exactly the right moment, and forgetting it is *silent*. The
# merge lands, this workflow finds the tag already there, and reports "nothing to release" for a
# change that plainly deserved one.
#
# So the commits decide now. They already say what kind of change each one is, and Conventional
# Commits is a semver vocabulary: `feat` moves the minor, `fix` and `perf` the patch, a `!` or a
# `BREAKING CHANGE:` footer the major — except below 1.0.0, where a break moves the minor because
# declaring 1.0 is a maintainer's decision and not a diff's. The reading itself lives in
# `packages/cli/scripts/next-version.ts`, under test, rather than in shell here: it is the one part
# of a release that can be wrong without failing, and YAML cannot be unit-tested.
#
# A run of `chore`, `docs`, `test`, `refactor`, `style`, `build` or `ci` commits releases nothing.
#
# This does not recur, and the reason is the same GitHub rule the dispatch below relies on: a push
# made with the built-in GITHUB_TOKEN does not start a workflow run. So the `chore(release)` commit
# triggers no Verify, and no Verify means no Release. Its type is a second, independent stop — a
# run that did somehow fire would find only a `chore` since the tag and cut nothing — but the token
# rule is what actually ends it, and it ends it before anything starts.
#
# The cost of that rule is worth naming: **the release commit is never verified.** It differs from
# the tree Verify passed by one version string, which is why this is acceptable, but "main's tip is
# green" stops being literally true the moment a release lands.
#
# Gated on Verify rather than on the push, so a red main cannot ship. `workflow_run` is what makes
# that expressible: it fires after Verify finishes and carries its conclusion and its commit.
#
# Publish is *dispatched* rather than left to its own `push: tags` trigger, and that is not a
# stylistic choice — a tag pushed with the built-in GITHUB_TOKEN deliberately does not start a new
# workflow run, so relying on the tag alone would tag every release and publish none of them.
# `workflow_dispatch` is one of the two events documented as exempt from that rule. The same rule
# is why there is no double-publish to guard against: only this dispatch starts Publish.

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

# One release at a time, and never cancel one — a half-finished tag-and-ship is worse than a queue.
concurrency:
  group: release
  cancel-in-progress: false

# A `permissions:` block replaces the defaults rather than extending them.
permissions:
  # Push the release commit and its tag.
  contents: write
  # Dispatch Publish.
  actions: write

jobs:
  release:
    name: Bump the version the commits ask for, and ship it
    # Verify runs on pull requests too, and on branches that are not main; a release may come from
    # exactly one of its runs — the one that went green on a push to main.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The commit Verify actually passed on, not whatever main's tip has become since — and the
      # whole history with it, because "what has happened since the last release" is a question
      # about the log and a shallow clone cannot answer it. `fetch-depth: 0` brings the tags too,
      # which is how the last release is found at all.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # This job is about to *commit* to main, which the old one never did — it only tagged. That
      # makes a moved tip a different kind of problem: the commits between the tested tree and
      # main's tip have not been through Verify, and committing on top of them would release them.
      #
      # Standing down is safe rather than lossy. Whatever landed in between had its own push to
      # main, so it has its own Verify run and its own Release run behind it, and that run sees a
      # tip that matches. The release is deferred by one merge, never dropped.
      - name: Stand down if main has moved past the tree Verify passed
        id: tip
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          tip="$(git rev-parse origin/main)"
          if [ "$tip" != "$SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved to ${tip} since Verify passed on ${SHA}; that merge's own run will release."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read what the commits since the last release ask for
        if: steps.tip.outputs.current == 'true'
        id: version
        run: |
          set -euo pipefail
          # By version rather than by date: a tag pushed out of order must not be read as the
          # latest release. Empty when none exists yet, which the script reads as "all of history".
          last="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          next="$(bun run packages/cli/scripts/next-version.ts --since "${last}" --write)"
          echo "last=${last:-<none>}" >> "$GITHUB_OUTPUT"
          if [ -z "$next" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing since ${last:-the beginning} asks for a release — no feat, fix, perf or breaking change."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${next}" >> "$GITHUB_OUTPUT"
            echo "tag=v${next}" >> "$GITHUB_OUTPUT"
            echo "::notice::${last:-The beginning} → v${next}."
          fi

      # Committed and tagged together, and pushed atomically below, so the tag can never name a
      # commit that is not on main — which is the state that would leave `git describe` and the
      # releases list disagreeing with the branch forever.
      - name: Commit the bump and tag it
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `chore(release)` on purpose: it is the type that asks for no release, so the Verify run
          # this commit triggers finds nothing to cut and the loop ends after one pass.
          git commit --quiet -m "chore(release): ${TAG}" -- packages/cli/package.json
          # Annotated, so the tag carries an author and a date of its own — `git describe` and the
          # releases list both read better for it.
          git tag -a "$TAG" -m "$TAG"

      # `--atomic` so the branch and the tag land together or not at all. Without it a rejected
      # branch push (someone merged in the last few seconds) could still leave the tag pushed,
      # pointing at a commit no branch contains — and Publish would then be dispatched at it.
      - name: Push the release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin "HEAD:main" "refs/tags/${TAG}"

      # Dispatched at the tag, so Publish sees `refs/tags/v<version>` exactly as it would from a
      # hand-pushed tag: its version guard compares the tag against the manifest, and its checkout
      # takes the tagged tree.
      - name: Ask Publish to ship it
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run publish.yml --ref "$TAG" --field dry_run=false
